<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7e6e0">
<title>中国象棋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1>中国象棋</h1>
    <div class="buttons">
      <button id="new-game" type="button">新局</button>
      <button id="undo" type="button" disabled>悔棋</button>
    </div>
  </header>
  <div id="status" class="status" role="status" aria-live="polite">加载中…</div>
  <div class="board-frame">
    <canvas id="board" width="620" height="684" aria-label="中国象棋棋盘"></canvas>
  </div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
